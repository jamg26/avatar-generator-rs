<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AvaGen Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        surface: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 900:'#0f172a', 950:'#080f1e' },
        indigo:  { 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5' },
      }
    }
  }
}
</script>
<style>
[x-cloak]{display:none!important}
body{background:#080f1e;color:#e2e8f0;font-family:'Inter',system-ui,sans-serif}
.scrollbar-thin::-webkit-scrollbar{width:4px;height:4px}
.scrollbar-thin::-webkit-scrollbar-track{background:transparent}
.scrollbar-thin::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:1.25rem}
.btn-primary{background:#4f46e5;color:#fff;border-radius:8px;padding:.45rem 1rem;font-size:.85rem;font-weight:500;transition:background .15s}
.btn-primary:hover{background:#4338ca}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid #1e293b;border-radius:8px;padding:.4rem .85rem;font-size:.82rem;transition:all .15s}
.btn-ghost:hover{border-color:#4f46e5;color:#818cf8}
.btn-danger{background:#7f1d1d;color:#fca5a5;border-radius:8px;padding:.4rem .85rem;font-size:.82rem;transition:background .15s}
.btn-danger:hover{background:#991b1b}
.btn-warn{background:#422006;color:#fcd34d;border-radius:8px;padding:.4rem .85rem;font-size:.82rem;transition:background .15s}
.btn-warn:hover{background:#78350f}
.nav-item{display:flex;align-items:center;gap:.55rem;padding:.5rem .85rem;border-radius:8px;font-size:.85rem;color:#94a3b8;cursor:pointer;transition:all .15s;text-decoration:none}
.nav-item:hover{background:#1e293b;color:#e2e8f0}
.nav-item.active{background:#1e3a5f;color:#818cf8}
.stat-card{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border:1px solid #1e293b;border-radius:12px;padding:1.25rem;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.accent-indigo::after{background:linear-gradient(90deg,#4f46e5,#818cf8)}
.stat-card.accent-green::after{background:linear-gradient(90deg,#059669,#34d399)}
.stat-card.accent-amber::after{background:linear-gradient(90deg,#d97706,#fbbf24)}
.stat-card.accent-rose::after{background:linear-gradient(90deg,#e11d48,#fb7185)}
.stat-card.accent-sky::after{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.stat-card.accent-purple::after{background:linear-gradient(90deg,#7c3aed,#c084fc)}
input,select{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:.45rem .75rem;font-size:.85rem;color:#e2e8f0;outline:none;transition:border .15s}
input:focus,select:focus{border-color:#4f46e5}
table{width:100%;border-collapse:collapse}
thead th{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#64748b;padding:.6rem .85rem;border-bottom:1px solid #1e293b;text-align:left}
tbody tr{border-bottom:1px solid #0f172a;transition:background .1s}
tbody tr:hover{background:#1e293b22}
tbody td{padding:.65rem .85rem;font-size:.83rem;color:#cbd5e1}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .55rem;border-radius:20px;font-size:.72rem;font-weight:500}
.badge-green{background:#052e16;color:#4ade80;border:1px solid #14532d}
.badge-indigo{background:#1e1b4b;color:#818cf8;border:1px solid #312e81}
.badge-amber{background:#1c1003;color:#fbbf24;border:1px solid #78350f}
.badge-rose{background:#1c0a0a;color:#fb7185;border:1px solid #7f1d1d}
.badge-slate{background:#0f172a;color:#64748b;border:1px solid #1e293b}
.badge-sky{background:#0c1a2e;color:#38bdf8;border:1px solid #0c4a6e}
.toast{position:fixed;top:1.25rem;right:1.25rem;z-index:9999;min-width:280px;max-width:460px;padding:.85rem 1.1rem;border-radius:10px;font-size:.84rem;display:flex;align-items:flex-start;gap:.6rem;box-shadow:0 8px 32px #00000066}
.toast-ok{background:#052e16;border:1px solid #166534;color:#4ade80}
.toast-err{background:#1c0a0a;border:1px solid #7f1d1d;color:#fb7185}
.modal-bg{position:fixed;inset:0;background:#00000088;backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:2rem;min-width:340px;max-width:480px;box-shadow:0 24px 48px #00000099}
.progress-bar{height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
</style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

<!-- Toast -->
<template x-if="toast">
  <div :class="'toast '+toast.type" @click="toast=null">
    <span x-text="toast.icon" class="text-lg leading-none mt-0.5"></span>
    <span x-text="toast.msg" class="flex-1"></span>
    <button class="opacity-50 hover:opacity-100 ml-2 text-base leading-none">✕</button>
  </div>
</template>

<!-- Confirm Modal -->
<template x-if="confirm">
  <div class="modal-bg" @click.self="confirm=null">
    <div class="modal">
      <h3 class="text-base font-semibold text-white mb-2" x-text="confirm.title"></h3>
      <p class="text-sm text-slate-400 mb-6 leading-relaxed" x-text="confirm.msg"></p>
      <div class="flex gap-3 justify-end">
        <button class="btn-ghost" @click="confirm=null">Cancel</button>
        <button :class="confirm.btnClass||'btn-danger'" @click="confirm.action();confirm=null" x-text="confirm.btn"></button>
      </div>
    </div>
  </div>
</template>

<!-- Login -->
<template x-if="!authed">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="text-5xl mb-3">⬡</div>
        <h1 class="text-2xl font-bold text-white">AvaGen Admin</h1>
        <p class="text-slate-500 text-sm mt-1">Sign in to continue</p>
      </div>
      <div class="card">
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Admin Secret</label>
        <input type="password" x-model="secret" @keydown.enter="login()" placeholder="••••••••••••" class="w-full mb-4"/>
        <button class="btn-primary w-full" @click="login()" :disabled="!secret.trim()">Sign In →</button>
        <p x-show="loginErr" class="text-rose-400 text-xs mt-3 text-center" x-text="loginErr"></p>
      </div>
    </div>
  </div>
</template>

<!-- Main App -->
<template x-if="authed">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-52 flex-shrink-0 flex flex-col border-r border-surface-800/60" style="background:#060d1a">
      <div class="px-4 py-5 border-b border-surface-800/60">
        <div class="flex items-center gap-2">
          <span class="text-2xl">⬡</span>
          <div>
            <div class="font-bold text-sm text-white">AvaGen</div>
            <div class="text-xs text-slate-500">Admin Console</div>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto scrollbar-thin">
        <template x-for="item in navItems" :key="item.id">
          <a class="nav-item" :class="tab===item.id?'active':''" @click="setTab(item.id)">
            <span class="text-base w-5 text-center" x-text="item.icon"></span>
            <span x-text="item.label"></span>
          </a>
        </template>
      </nav>

      <div class="px-3 py-3 border-t border-surface-800/60 space-y-2">
        <!-- Auto-refresh -->
        <div class="flex items-center justify-between px-1">
          <span class="text-xs text-slate-500">Auto-refresh</span>
          <button @click="autoRefresh=!autoRefresh" :class="autoRefresh?'text-indigo-400':'text-slate-600'" class="text-xs font-medium transition-colors">
            <span x-text="autoRefresh?'ON':'OFF'"></span>
          </button>
        </div>
        <template x-if="autoRefresh">
          <div class="px-1">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs text-slate-600">↻ next in <span class="text-slate-400" x-text="refreshCountdown+'s'"></span></span>
              <select x-model.number="refreshInterval" class="text-xs py-0.5 px-1" style="font-size:.7rem;padding:.2rem .4rem">
                <option value="15">15s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
                <option value="120">2m</option>
              </select>
            </div>
            <div class="progress-bar">
              <div class="progress-fill bg-indigo-600" :style="`width:${100-refreshCountdown/refreshInterval*100}%`"></div>
            </div>
          </div>
        </template>
        <button class="btn-ghost w-full text-center text-xs" @click="reload()">⟳ Refresh</button>
        <button class="btn-ghost w-full text-center text-xs text-slate-600" @click="logout()">⎋ Sign Out</button>
      </div>
    </aside>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto scrollbar-thin">

      <!-- Dashboard -->
      <div x-show="tab==='dashboard'" class="p-6">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold text-white">Dashboard</h2>
            <p class="text-slate-500 text-sm mt-0.5">Overview of your deployment</p>
          </div>
          <template x-if="loading.dash"><span class="text-slate-500 text-sm animate-pulse">Loading…</span></template>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
          <div class="stat-card accent-indigo">
            <div class="text-xs text-slate-500 mb-1">Total Keys</div>
            <div class="text-2xl font-bold text-white" x-text="dash.keys?.total??'—'"></div>
          </div>
          <div class="stat-card accent-green">
            <div class="text-xs text-slate-500 mb-1">Active Keys</div>
            <div class="text-2xl font-bold text-emerald-400" x-text="dash.keys?.active??'—'"></div>
          </div>
          <div class="stat-card accent-sky">
            <div class="text-xs text-slate-500 mb-1">Today</div>
            <div class="text-2xl font-bold text-sky-400" x-text="dash.requests?.today??'—'"></div>
          </div>
          <div class="stat-card accent-purple">
            <div class="text-xs text-slate-500 mb-1">This Month</div>
            <div class="text-2xl font-bold text-purple-400" x-text="dash.requests?.month??'—'"></div>
          </div>
          <div class="stat-card accent-amber">
            <div class="text-xs text-slate-500 mb-1">Active Jobs</div>
            <div class="text-2xl font-bold text-amber-400" x-text="dash.active_jobs??'—'"></div>
          </div>
          <div class="stat-card" :class="dash.health==='online'?'accent-green':dash.health==='degraded'?'accent-amber':'accent-rose'">
            <div class="text-xs text-slate-500 mb-1">API Status</div>
            <div class="text-base font-semibold mt-1"
                 :class="dash.health==='online'?'text-emerald-400':dash.health==='degraded'?'text-amber-400':'text-rose-400'"
                 x-text="dash.health??'—'"></div>
          </div>
        </div>

        <div class="card">
          <h3 class="text-sm font-semibold text-slate-300 mb-3">Recent Activity</h3>
          <table>
            <thead><tr>
              <th>Key</th><th>Prefix</th><th>Endpoint</th><th>Count</th><th>Time (UTC)</th>
            </tr></thead>
            <tbody>
              <template x-if="!dash.recent?.length">
                <tr><td colspan="5" class="text-center py-8 text-slate-600">No recent activity</td></tr>
              </template>
              <template x-for="r in dash.recent||[]" :key="r.created_at+r.endpoint">
                <tr>
                  <td class="font-medium" x-text="r.name||'(deleted)'"></td>
                  <td><span class="font-mono text-slate-500 text-xs" x-text="r.key_prefix||''"></span></td>
                  <td><span class="font-mono text-indigo-400 text-xs" x-text="r.endpoint"></span></td>
                  <td x-text="r.count"></td>
                  <td class="text-slate-500 text-xs" x-text="fmt(r.created_at)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- API Keys -->
      <div x-show="tab==='keys'" class="p-6">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold text-white">API Keys</h2>
            <p class="text-slate-500 text-sm mt-0.5">Manage access credentials</p>
          </div>
          <button class="btn-primary" @click="showNewKey=!showNewKey">+ New Key</button>
        </div>

        <!-- Create form -->
        <template x-if="showNewKey">
          <div class="card mb-4">
            <h3 class="text-sm font-semibold text-slate-300 mb-3">Create API Key</h3>
            <div class="flex flex-wrap gap-3 items-end">
              <div>
                <label class="text-xs text-slate-500 block mb-1">Name</label>
                <input x-model="newKey.name" placeholder="My App" class="w-48"/>
              </div>
              <div>
                <label class="text-xs text-slate-500 block mb-1">Monthly Quota</label>
                <input x-model.number="newKey.quota" type="number" class="w-28" placeholder="500"/>
              </div>
              <button class="btn-primary" @click="createKey()" :disabled="!newKey.name.trim()">Create</button>
              <button class="btn-ghost" @click="showNewKey=false">Cancel</button>
            </div>
            <template x-if="createdKey">
              <div class="mt-4 p-3 rounded-lg bg-emerald-950 border border-emerald-800">
                <p class="text-xs text-emerald-400 font-medium mb-1">✓ Key created — copy it now, it won't be shown again:</p>
                <code class="text-xs text-white font-mono break-all" x-text="createdKey"></code>
              </div>
            </template>
          </div>
        </template>

        <div class="card">
          <template x-if="loading.keys"><div class="text-center py-12 text-slate-600 text-sm animate-pulse">Loading…</div></template>
          <template x-if="!loading.keys">
            <table>
              <thead><tr>
                <th>Name</th><th>Prefix</th><th>Monthly</th><th>Quota</th><th>Total</th><th>Status</th><th>Created</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <template x-if="!keys.length">
                  <tr><td colspan="8" class="text-center py-8 text-slate-600">No keys found</td></tr>
                </template>
                <template x-for="k in keys" :key="k.id">
                  <tr>
                    <td class="font-medium text-white" x-text="k.name"></td>
                    <td><span class="font-mono text-xs text-slate-500" x-text="k.key_prefix"></span></td>
                    <td>
                      <div class="flex items-center gap-2">
                        <span x-text="k.monthly_used" class="text-sm"></span>
                        <div class="progress-bar w-16">
                          <div class="progress-fill"
                               :style="`width:${Math.min(100,k.monthly_quota>0?k.monthly_used/k.monthly_quota*100:0)}%;background:${k.monthly_quota>0&&k.monthly_used/k.monthly_quota>.9?'#e11d48':k.monthly_quota>0&&k.monthly_used/k.monthly_quota>.7?'#d97706':'#4f46e5'}`"></div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <template x-if="editingQuota===k.id">
                        <div class="flex items-center gap-1">
                          <input x-model.number="quotaDraft" type="number" class="w-20 py-0.5 text-xs" @keydown.enter="saveQuota(k.id)" @keydown.escape="editingQuota=null"/>
                          <button class="text-xs text-indigo-400 hover:text-indigo-300" @click="saveQuota(k.id)">✓</button>
                          <button class="text-xs text-slate-500 hover:text-slate-300" @click="editingQuota=null">✕</button>
                        </div>
                      </template>
                      <template x-if="editingQuota!==k.id">
                        <button class="text-slate-300 hover:text-white text-sm" @click="editingQuota=k.id;quotaDraft=k.monthly_quota" x-text="k.monthly_quota" title="Click to edit"></button>
                      </template>
                    </td>
                    <td x-text="k.total_used"></td>
                    <td>
                      <span :class="k.is_active?'badge-green':'badge-slate'" class="badge">
                        <span x-text="k.is_active?'● Active':'○ Revoked'"></span>
                      </span>
                    </td>
                    <td class="text-slate-500 text-xs" x-text="fmtDate(k.created_at)"></td>
                    <td>
                      <div class="flex gap-1.5">
                        <template x-if="k.is_active">
                          <button class="btn-warn text-xs py-0.5 px-2" @click="askConfirm('Revoke Key',`Revoke &quot;${k.name}&quot;? Clients will get 401 errors.`,'Revoke','btn-warn',()=>revokeKey(k.id))">Revoke</button>
                        </template>
                        <button class="btn-danger text-xs py-0.5 px-2" @click="askConfirm('Delete Key',`Permanently delete &quot;${k.name}&quot; and all usage logs? This cannot be undone.`,'Delete','btn-danger',()=>deleteKey(k.id))">Delete</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </div>

      <!-- Metrics -->
      <div x-show="tab==='metrics'" class="p-6">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold text-white">Metrics</h2>
            <p class="text-slate-500 text-sm mt-0.5">Usage analytics</p>
          </div>
          <div class="flex items-center gap-2">
            <select x-model.number="mDays" @change="loadMetrics()" class="text-sm">
              <option value="7">7 days</option>
              <option value="14">14 days</option>
              <option value="30">30 days</option>
              <option value="90">90 days</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
          <div class="card">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">Daily Requests</h3>
            <canvas id="dailyChart" height="180"></canvas>
            <template x-if="!metrics.daily?.length"><div class="text-center py-8 text-slate-600 text-sm">No data</div></template>
          </div>
          <div class="card">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">Hourly Requests (today)</h3>
            <canvas id="hourlyChart" height="180"></canvas>
            <template x-if="!metrics.hourly?.length"><div class="text-center py-8 text-slate-600 text-sm">No data today</div></template>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="card">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">Usage by Key — this month</h3>
            <template x-if="!metrics.per_key?.length"><div class="text-center py-6 text-slate-600 text-sm">No active keys</div></template>
            <template x-for="k in metrics.per_key||[]" :key="k.name">
              <div class="mb-3">
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-slate-300" x-text="k.name"></span>
                  <span class="text-slate-500"><span x-text="k.used"></span> / <span x-text="k.monthly_quota"></span></span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill"
                       :style="`width:${Math.min(100,k.monthly_quota>0?k.used/k.monthly_quota*100:0)}%;background:${k.monthly_quota>0&&k.used/k.monthly_quota>.9?'#e11d48':k.monthly_quota>0&&k.used/k.monthly_quota>.7?'#d97706':'#4f46e5'}`"></div>
                </div>
              </div>
            </template>
          </div>
          <div class="card">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">Top Endpoints — 30 days</h3>
            <template x-if="!metrics.endpoints?.length"><div class="text-center py-6 text-slate-600 text-sm">No data</div></template>
            <template x-if="metrics.endpoints?.length">
              <div>
                <template x-for="e in metrics.endpoints" :key="e.endpoint">
                  <div class="flex items-center justify-between py-1.5 border-b border-surface-800/40 last:border-0">
                    <span class="font-mono text-xs text-indigo-400" x-text="e.endpoint"></span>
                    <span class="text-sm font-medium text-slate-300" x-text="e.n.toLocaleString()"></span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Jobs -->
      <div x-show="tab==='jobs'" class="p-6">
        <div class="flex items-center gap-3 mb-6">
          <div>
            <h2 class="text-xl font-bold text-white">Batch Jobs</h2>
            <p class="text-slate-500 text-sm mt-0.5">Monitor and control generation jobs</p>
          </div>
          <template x-if="jobs.length">
            <div class="flex gap-2 ml-2">
              <span class="badge badge-slate" x-text="jobs.length+' total'"></span>
              <span class="badge badge-amber" x-text="jobs.filter(j=>['queued','running','uploading'].includes(j.state)).length+' active'"></span>
            </div>
          </template>
        </div>

        <div class="card">
          <template x-if="loading.jobs"><div class="text-center py-12 text-slate-600 text-sm animate-pulse">Loading…</div></template>
          <template x-if="!loading.jobs">
            <table>
              <thead><tr>
                <th>Job ID</th><th>State</th><th>Progress</th><th>Failed</th><th>Model</th><th>API Key</th><th>Queue</th><th>Created</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <template x-if="!jobs.length">
                  <tr><td colspan="9" class="text-center py-8 text-slate-600">No jobs found</td></tr>
                </template>
                <template x-for="j in jobs" :key="j.id">
                  <tr>
                    <td><span class="font-mono text-xs text-slate-400" x-text="j.id.slice(0,8)+'…'"></span></td>
                    <td>
                      <span :class="jobBadge(j.state)" class="badge" x-text="jobLabel(j.state)"></span>
                    </td>
                    <td>
                      <div class="min-w-[100px]">
                        <div class="flex justify-between text-xs mb-1">
                          <span x-text="j.completed+'/'+j.total" class="text-slate-400"></span>
                          <span x-text="j.total>0?Math.round(j.completed/j.total*100)+'%':'0%'" class="text-slate-500"></span>
                        </div>
                        <div class="progress-bar">
                          <div class="progress-fill"
                               :style="`width:${j.total>0?j.completed/j.total*100:0}%;background:${['running','uploading'].includes(j.state)?'#4f46e5':j.state==='done'?'#059669':j.state==='failed'?'#e11d48':'#334155'}`"></div>
                        </div>
                      </div>
                    </td>
                    <td x-text="j.failed_count||0" :class="j.failed_count?'text-rose-400':''"></td>
                    <td class="text-slate-500 text-xs" x-text="j.model"></td>
                    <td><span class="font-mono text-xs text-slate-500" x-text="j.key_name||j.key_prefix||'—'"></span></td>
                    <td x-text="j.queue_position??'—'" class="text-slate-500 text-xs"></td>
                    <td class="text-slate-500 text-xs" x-text="fmt(j.created_at)"></td>
                    <td>
                      <div class="flex gap-1.5">
                        <template x-if="['queued','running','uploading'].includes(j.state)">
                          <button class="btn-warn text-xs py-0.5 px-2" @click="askConfirm('Cancel Job',`Cancel job ${j.id.slice(0,8)}? Generation will stop.`,'Cancel Job','btn-warn',()=>cancelJob(j.id))">Cancel</button>
                        </template>
                        <template x-if="j.download_url">
                          <a :href="j.download_url" target="_blank" class="btn-ghost text-xs py-0.5 px-2">↓</a>
                        </template>
                        <button class="btn-danger text-xs py-0.5 px-2" @click="askConfirm('Delete Job',`Delete record for job ${j.id.slice(0,8)}? This is permanent.`,'Delete','btn-danger',()=>deleteJob(j.id))">Delete</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </div>

      <!-- System -->
      <div x-show="tab==='system'" class="p-6">
        <div class="mb-6">
          <h2 class="text-xl font-bold text-white">System</h2>
          <p class="text-slate-500 text-sm mt-0.5">Infrastructure status</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div class="card">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-2 h-2 rounded-full" :class="sys.health==='online'?'bg-emerald-400 shadow-[0_0_6px_#4ade80]':'bg-rose-400 shadow-[0_0_6px_#f87171]'"></div>
              <span class="text-sm font-semibold text-slate-300">API Server</span>
            </div>
            <div class="text-lg font-bold" :class="sys.health==='online'?'text-emerald-400':'text-rose-400'" x-text="sys.health||'—'"></div>
            <div class="text-xs text-slate-600 mt-1" x-text="window.location.origin"></div>
          </div>
          <div class="card">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-2 h-2 rounded-full" :class="sys.db?.status==='connected'?'bg-emerald-400 shadow-[0_0_6px_#4ade80]':'bg-rose-400 shadow-[0_0_6px_#f87171]'"></div>
              <span class="text-sm font-semibold text-slate-300">Database</span>
            </div>
            <div class="text-lg font-bold" :class="sys.db?.status==='connected'?'text-emerald-400':'text-rose-400'" x-text="sys.db?.status||'—'"></div>
            <div class="text-xs text-slate-600 mt-1 truncate" x-text="sys.db?.version?.split(' ').slice(0,2).join(' ')||''"></div>
          </div>
        </div>

        <div class="card">
          <h3 class="text-sm font-semibold text-slate-400 mb-3">Database Statistics</h3>
          <div class="grid grid-cols-3 gap-4">
            <div class="text-center">
              <div class="text-2xl font-bold text-indigo-400" x-text="(sys.db?.keys??'—').toLocaleString()"></div>
              <div class="text-xs text-slate-500 mt-1">API Keys</div>
            </div>
            <div class="text-center">
              <div class="text-2xl font-bold text-sky-400" x-text="(sys.db?.logs??'—').toLocaleString()"></div>
              <div class="text-xs text-slate-500 mt-1">Usage Log Rows</div>
            </div>
            <div class="text-center">
              <div class="text-2xl font-bold text-purple-400" x-text="(sys.db?.jobs??'—').toLocaleString()"></div>
              <div class="text-xs text-slate-500 mt-1">Batch Jobs</div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</template>

<script>
const CHART_DEFAULTS = {
  responsive:true, maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',titleColor:'#94a3b8',bodyColor:'#e2e8f0',borderColor:'#334155',borderWidth:1}},
  scales:{x:{grid:{color:'#1e293b22'},ticks:{color:'#64748b',font:{size:10}}},y:{grid:{color:'#1e293b44'},ticks:{color:'#64748b',font:{size:10}}}},
};

let dailyChart=null, hourlyChart=null;

function app() {
  return {
    // Auth
    authed: false,
    secret: '',
    loginErr: '',

    // Navigation
    tab: 'dashboard',
    navItems: [
      {id:'dashboard', icon:'◈', label:'Dashboard'},
      {id:'keys',      icon:'⊞', label:'API Keys'},
      {id:'metrics',   icon:'∿', label:'Metrics'},
      {id:'jobs',      icon:'⊙', label:'Jobs'},
      {id:'system',    icon:'⊟', label:'System'},
    ],

    // Data
    dash: {}, keys: [], metrics: {}, jobs: [], sys: {},
    loading: {dash:false,keys:false,metrics:false,jobs:false,sys:false},

    // UI state
    toast: null,
    toastTimer: null,
    confirm: null,
    showNewKey: false,
    newKey: {name:'',quota:500},
    createdKey: null,
    editingQuota: null,
    quotaDraft: 0,
    mDays: 30,

    // Auto-refresh
    autoRefresh: true,
    refreshInterval: 30,
    refreshCountdown: 30,
    _refreshTimer: null,
    _countdownTimer: null,

    init() {
      const s = sessionStorage.getItem('avagen_secret');
      if (s) { this.secret = s; this.authed = true; this.afterLogin(); }
    },

    hdr() {
      return {'X-Admin-Secret': this.secret, 'Content-Type':'application/json'};
    },

    async api(path, opts={}) {
      const r = await fetch(path, {headers:this.hdr(), ...opts});
      if (r.status===401||r.status===403) { this.logout(); return null; }
      if (!r.ok) {
        const e = await r.json().catch(()=>({}));
        throw new Error(e.error||`HTTP ${r.status}`);
      }
      return r.json();
    },

    async login() {
      this.loginErr = '';
      try {
        await this.api('/api/admin/dashboard');
        sessionStorage.setItem('avagen_secret', this.secret);
        this.authed = true;
        this.afterLogin();
      } catch(e) {
        this.loginErr = 'Invalid secret or server error';
      }
    },

    logout() {
      sessionStorage.removeItem('avagen_secret');
      this.authed = false;
      this.secret = '';
      clearInterval(this._refreshTimer);
      clearInterval(this._countdownTimer);
    },

    afterLogin() {
      this.loadTab();
      this.startRefreshTimer();
    },

    setTab(id) {
      this.tab = id;
      this.loadTab();
      this.resetCountdown();
    },

    loadTab() {
      switch(this.tab) {
        case 'dashboard': this.loadDash(); break;
        case 'keys':      this.loadKeys(); break;
        case 'metrics':   this.loadMetrics(); break;
        case 'jobs':      this.loadJobs(); break;
        case 'system':    this.loadSys(); break;
      }
    },

    reload() {
      this.loadTab();
      this.resetCountdown();
    },

    startRefreshTimer() {
      clearInterval(this._refreshTimer);
      clearInterval(this._countdownTimer);
      this._countdownTimer = setInterval(() => {
        if (!this.autoRefresh) return;
        this.refreshCountdown = Math.max(0, this.refreshCountdown - 1);
        if (this.refreshCountdown === 0) {
          this.loadTab();
          this.resetCountdown();
        }
      }, 1000);
    },

    resetCountdown() {
      this.refreshCountdown = this.refreshInterval;
    },

    // ── Data loaders ──────────────────────────────────────────────────────────

    async loadDash() {
      this.loading.dash = true;
      try { this.dash = await this.api('/api/admin/dashboard') || {}; }
      catch(e) { this.showToast('Failed to load dashboard: '+e.message, true); }
      finally { this.loading.dash = false; }
    },

    async loadKeys() {
      this.loading.keys = true;
      try {
        const d = await this.api('/api/admin/keys');
        this.keys = d?.keys || [];
      } catch(e) { this.showToast('Failed to load keys: '+e.message, true); }
      finally { this.loading.keys = false; }
    },

    async loadMetrics() {
      this.loading.metrics = true;
      try {
        this.metrics = await this.api(`/api/admin/metrics?days=${this.mDays}`) || {};
        this.$nextTick(() => this.renderCharts());
      } catch(e) { this.showToast('Failed to load metrics: '+e.message, true); }
      finally { this.loading.metrics = false; }
    },

    async loadJobs() {
      this.loading.jobs = true;
      try {
        const d = await this.api('/api/admin/jobs');
        this.jobs = d?.jobs || [];
      } catch(e) { this.showToast('Failed to load jobs: '+e.message, true); }
      finally { this.loading.jobs = false; }
    },

    async loadSys() {
      this.loading.sys = true;
      try { this.sys = await this.api('/api/admin/system') || {}; }
      catch(e) { this.showToast('Failed to load system info: '+e.message, true); }
      finally { this.loading.sys = false; }
    },

    // ── Actions ───────────────────────────────────────────────────────────────

    async createKey() {
      try {
        const d = await this.api('/api/admin/keys', {
          method:'POST',
          body: JSON.stringify({name:this.newKey.name.trim(), monthly_quota:this.newKey.quota})
        });
        this.createdKey = d.key || d.api_key || '(see server logs)';
        this.newKey = {name:'',quota:500};
        await this.loadKeys();
        this.showToast('Key created — copy it from the form above', false);
      } catch(e) { this.showToast('Create failed: '+e.message, true); }
    },

    async revokeKey(id) {
      try {
        await this.api(`/api/admin/keys/${id}`, {method:'DELETE'});
        await this.loadKeys();
        this.showToast('Key revoked', false);
      } catch(e) { this.showToast('Revoke failed: '+e.message, true); }
    },

    async deleteKey(id) {
      try {
        await this.api(`/api/admin/keys/${id}/hard`, {method:'DELETE'});
        await this.loadKeys();
        this.showToast('Key deleted permanently', false);
      } catch(e) { this.showToast('Delete failed: '+e.message, true); }
    },

    async saveQuota(id) {
      try {
        await this.api(`/api/admin/keys/${id}`, {method:'PATCH', body:JSON.stringify({monthly_quota:this.quotaDraft})});
        this.editingQuota = null;
        await this.loadKeys();
        this.showToast('Quota updated', false);
      } catch(e) { this.showToast('Update failed: '+e.message, true); }
    },

    async cancelJob(id) {
      try {
        await this.api(`/api/admin/jobs/${id}/cancel`, {method:'POST'});
        await this.loadJobs();
        this.showToast('Job cancellation requested', false);
      } catch(e) { this.showToast('Cancel failed: '+e.message, true); }
    },

    async deleteJob(id) {
      try {
        await this.api(`/api/admin/jobs/${id}`, {method:'DELETE'});
        await this.loadJobs();
        this.showToast('Job deleted', false);
      } catch(e) { this.showToast('Delete failed: '+e.message, true); }
    },

    // ── Helpers ───────────────────────────────────────────────────────────────

    askConfirm(title, msg, btn, btnClass, action) {
      this.confirm = {title, msg, btn, btnClass, action};
    },

    showToast(msg, err) {
      clearTimeout(this.toastTimer);
      this.toast = {msg, type:err?'toast-err':'toast-ok', icon:err?'⊗':'✓'};
      this.toastTimer = setTimeout(() => this.toast=null, 6000);
    },

    fmt(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('en-GB',{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    },
    fmtDate(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleDateString('en-GB',{year:'2-digit',month:'short',day:'numeric'});
    },

    jobBadge(s) {
      return {queued:'badge-amber',running:'badge-indigo',uploading:'badge-sky',done:'badge-green',failed:'badge-rose',cancelled:'badge-slate'}[s]||'badge-slate';
    },
    jobLabel(s) {
      return {queued:'◷ queued',running:'▶ running',uploading:'↑ uploading',done:'✓ done',failed:'✗ failed',cancelled:'⊗ cancelled'}[s]||s;
    },

    renderCharts() {
      const daily  = this.metrics?.daily  || [];
      const hourly = this.metrics?.hourly || [];

      // Destroy existing
      if (dailyChart)  { dailyChart.destroy();  dailyChart=null; }
      if (hourlyChart) { hourlyChart.destroy();  hourlyChart=null; }

      const dc = document.getElementById('dailyChart');
      const hc = document.getElementById('hourlyChart');
      if (!dc || !hc) return;

      if (daily.length) {
        dailyChart = new Chart(dc, {
          type:'bar',
          data:{ labels:daily.map(r=>r.d), datasets:[{data:daily.map(r=>r.n), backgroundColor:'#4f46e5', borderRadius:4, hoverBackgroundColor:'#818cf8'}] },
          options:{...CHART_DEFAULTS, plugins:{...CHART_DEFAULTS.plugins}},
        });
      }

      if (hourly.length) {
        hourlyChart = new Chart(hc, {
          type:'bar',
          data:{ labels:hourly.map(r=>r.h+':00'), datasets:[{data:hourly.map(r=>r.n), backgroundColor:'#059669', borderRadius:4, hoverBackgroundColor:'#34d399'}] },
          options:{...CHART_DEFAULTS},
        });
      }
    },
  };
}
</script>
</body>
</html>
